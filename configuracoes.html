<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Turismo OS — Configurações</title>
 <script>
   (function () {
     var l = document.createElement('link');
     l.rel = 'stylesheet';
     l.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap';
     document.head.appendChild(l);
   })();
 </script>
 <style>
   /* ===== Identidade visual reaproveitada do sistema existente ===== */
   :root {
     --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
     --brand: #0d6efd; --brand-dark: #0a58ca; --danger: #dc3545;
     --ok: #16a34a; --warn: #d97706; --bg: #f6f8fc; --sidebar: #0b1220;
     --radius: 13px;
   }
   * { box-sizing: border-box; }
   html, body { margin: 0; height: 100%; }
   body {
     font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
     background: var(--bg); color: var(--text);
     display: grid; grid-template-columns: 248px 1fr; min-height: 100vh;
   }

   .sidebar { background: var(--sidebar); color: #cbd5e1; display: flex; flex-direction: column;
     position: sticky; top: 0; height: 100vh; z-index: 40; }
   .sidebar .brand { display: flex; align-items: center; gap: 11px; padding: 20px 20px 18px;
     font-weight: 700; color: #fff; border-bottom: 1px solid rgba(255,255,255,.07); }
   .sidebar .brand .mark { width: 34px; height: 34px; border-radius: 10px;
     background: linear-gradient(135deg, #3b82f6, #0ea5e9); display: grid; place-items: center;
     flex: 0 0 auto; box-shadow: 0 6px 18px rgba(37,99,235,.4); }
   .sidebar .brand .mark svg { width: 19px; height: 19px; }
   .sidebar .brand small { display: block; font-weight: 400; color: #7d90b8; font-size: 11.5px; margin-top: 1px; }

   .nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; flex: 1; }
   .nav .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .9px;
     color: #5b6b8c; font-weight: 600; padding: 12px 12px 6px; }
   .nav a { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-radius: 10px;
     color: #b6c2da; text-decoration: none; font-size: 14px; font-weight: 500;
     transition: background .15s, color .15s; cursor: pointer; }
   .nav a svg { width: 18px; height: 18px; flex: 0 0 auto; opacity: .85; }
   .nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
   .nav a.active { background: linear-gradient(90deg, rgba(13,110,253,.9), rgba(13,110,253,.55));
     color: #fff; box-shadow: 0 6px 16px rgba(13,110,253,.28); }

   .sidebar .userbox { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.07);
     display: flex; align-items: center; gap: 11px; }
   .avatar { width: 36px; height: 36px; border-radius: 50%; flex: 0 0 auto;
     background: linear-gradient(135deg, #3b82f6, #0ea5e9); display: grid; place-items: center;
     color: #fff; font-weight: 700; font-size: 14px; }
   .userbox .uinfo { min-width: 0; }
   .userbox .uname { color: #fff; font-size: 13.5px; font-weight: 600; white-space: nowrap;
     overflow: hidden; text-overflow: ellipsis; }
   .userbox .urole { color: #7d90b8; font-size: 11.5px; text-transform: capitalize; }
   .userbox .logout { margin-left: auto; background: transparent; border: 0; color: #7d90b8;
     cursor: pointer; padding: 6px; border-radius: 8px; display: grid; place-items: center; }
   .userbox .logout:hover { background: rgba(255,255,255,.08); color: #fff; }
   .userbox .logout svg { width: 17px; height: 17px; }

   .main { display: flex; flex-direction: column; min-width: 0; }
   .topbar { background: #fff; border-bottom: 1px solid var(--line); padding: 15px 26px;
     display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 30; }
   .topbar .hamburger { display: none; background: transparent; border: 0; cursor: pointer;
     padding: 6px; border-radius: 8px; color: var(--text); }
   .topbar h1 { margin: 0; font-size: 19px; letter-spacing: -.2px; }
   .topbar .sub { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
   .topbar .spacer { flex: 1; }
   .topbar .refresh { display: inline-flex; align-items: center; gap: 7px; background: #f1f5f9;
     border: 1px solid var(--line); color: #475569; padding: 8px 13px; border-radius: 9px;
     font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
   .topbar .refresh:hover { background: #e9eef5; }
   .topbar .refresh svg { width: 15px; height: 15px; }
   .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted);
     text-decoration: none; font-size: 13px; font-weight: 600; }
   .back-link:hover { color: var(--brand); }

   .content { padding: 22px 26px 60px; }

   /* ===== ABAS DE CONFIGURAÇÃO ===== */
   .cfg-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px;
     background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; }
   .cfg-tabs button {
     border: 0; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600;
     color: var(--muted); padding: 9px 14px; border-radius: 9px; cursor: pointer;
     transition: background .15s, color .15s; white-space: nowrap;
   }
   .cfg-tabs button:hover { background: #f1f5f9; color: var(--text); }
   .cfg-tabs button.on { background: var(--brand); color: #fff; box-shadow: 0 6px 16px rgba(13,110,253,.25); }
   .cfg-tabs button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
     background: var(--warn); margin-left: 6px; vertical-align: middle; }

   .cfg-pane { display: none; }
   .cfg-pane.on { display: block; }

   .panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
     overflow: hidden; margin-bottom: 18px; }
   .panel-head { padding: 15px 18px; border-bottom: 1px solid var(--line);
     display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
   .panel-head h2 { margin: 0; font-size: 15.5px; }
   .panel-head .desc { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
   .panel-body { padding: 18px; }

   /* ===== CAMPOS ===== */
   .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
   .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
   .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
   .field label { font-size: 12.5px; font-weight: 600; color: #334155; }
   .field .hint { font-size: 11.5px; color: var(--muted); }
   .field input, .field select, .field textarea {
     padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 9px;
     font-family: inherit; font-size: 13.5px; outline: none; background: #fff; width: 100%;
   }
   .field input:focus, .field select:focus, .field textarea:focus {
     border-color: var(--brand); box-shadow: 0 0 0 3px rgba(13,110,253,.12); }
   .field input.invalid, .field select.invalid { border-color: var(--danger); background: #fff5f5; }
   .field.invalid label { color: var(--danger); }
   .field .erro { font-size: 11.5px; color: var(--danger); font-weight: 600; }
   .field.full { grid-column: 1 / -1; }
   .field textarea { min-height: 74px; resize: vertical; }

   /* ===== TOGGLES (parâmetros de configuração) ===== */
   .params { display: flex; flex-direction: column; gap: 2px; }
   .param { display: flex; align-items: flex-start; gap: 12px; padding: 11px 12px;
     border-radius: 10px; cursor: pointer; transition: background .13s; }
   .param:hover { background: #f8fafc; }
   .param input[type="checkbox"] { width: 18px; height: 18px; margin: 1px 0 0; flex: 0 0 auto;
     accent-color: var(--brand); cursor: pointer; }
   .param .ptxt { min-width: 0; flex: 1; }
   .param .ptxt .nome { font-size: 13.5px; font-weight: 600; }
   .param .ptxt .dica { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
   .param .pin { flex: 0 0 auto; font-size: 11px; color: var(--muted); padding-top: 3px; }
   .param.off .nome { color: #94a3b8; }
   .param-destaque { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 10px;
     padding: 12px; font-size: 12.5px; color: #075985; margin-bottom: 12px; }

   .subtitulo { font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
     color: var(--muted); font-weight: 700; margin: 18px 0 6px; }
   .subtitulo:first-child { margin-top: 0; }

   /* ===== BOTÕES ===== */
   .btn { border: 0; border-radius: 9px; padding: 9px 15px; font-family: inherit;
     font-size: 13.5px; font-weight: 600; cursor: pointer; transition: filter .15s, transform .05s; }
   .btn:active { transform: translateY(1px); }
   .btn:disabled { opacity: .55; cursor: not-allowed; }
   .btn-primary { background: var(--brand); color: #fff; }
   .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
   .btn-ok { background: #dcfce7; color: #15803d; }
   .btn-danger { background: #fee2e2; color: #b91c1c; }
   .btn-warn { background: #fef3c7; color: #b45309; }
   .btn-ghost-m { background: #f1f5f9; color: #475569; }
   .btn-ghost-m:hover { background: #e9eef5; }
   .btn-sm { padding: 6px 11px; font-size: 12.5px; }
   .actions { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }

   .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
   .badge.on { background: #dcfce7; color: #15803d; }
   .badge.off { background: #f1f5f9; color: #64748b; }
   .badge.warn { background: #fef3c7; color: #b45309; }
   .badge.err { background: #fee2e2; color: #b91c1c; }
   .badge.info { background: #dbeafe; color: #1d4ed8; }

   /* ===== TABELAS ===== */
   table { width: 100%; border-collapse: collapse; }
   th, td { text-align: left; padding: 12px 16px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
   th { background: #fafbfe; color: var(--muted); font-size: 11.5px; text-transform: uppercase;
     letter-spacing: .5px; font-weight: 600; }
   tbody tr:last-child td { border-bottom: 0; }
   tbody tr:hover { background: #f8fafc; }
   .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
   .muted { color: var(--muted); font-size: 12.5px; }
   .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }

   /* ===== MODAL ===== */
   .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 90;
     display: none; align-items: flex-start; justify-content: center; padding: 34px 16px; overflow-y: auto; }
   .overlay.show { display: flex; }
   .modal { background: #fff; border-radius: 15px; width: 100%; max-width: 620px;
     padding: 22px; box-shadow: 0 22px 60px rgba(2,6,23,.3); }
   .modal.wide { max-width: 860px; }
   .modal h3 { margin: 0 0 6px; font-size: 17px; }
   .modal .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
   .modal-foot { display: flex; gap: 9px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }

   .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(90px);
     background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 11px; font-size: 13.5px;
     font-weight: 600; z-index: 120; opacity: 0; transition: all .26s; max-width: 90vw; text-align: center; }
   .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
   .toast.err { background: var(--danger); }
   .toast.ok { background: #15803d; }

   .aviso-servidor { background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
     padding: 12px 15px; border-radius: 11px; font-size: 13px; margin-bottom: 16px; }
   .info-box { background: #f0f9ff; border: 1px solid #bae6fd; color: #075985;
     padding: 12px 15px; border-radius: 11px; font-size: 13px; margin-bottom: 16px; }
   .erro-box { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
     padding: 12px 15px; border-radius: 11px; font-size: 13px; margin-bottom: 16px; }
   .ok-box { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534;
     padding: 12px 15px; border-radius: 11px; font-size: 13px; margin-bottom: 16px; }
   ul.checks { margin: 8px 0 0; padding-left: 20px; }
   ul.checks li { font-size: 12.5px; margin-bottom: 4px; }

   /* ===== ABA PRODUTOS (catalogo com foto) ===== */
   .prod-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
   .prod-toolbar input { flex: 1; min-width: 200px; padding: 9px 12px; border: 1.5px solid var(--line);
     border-radius: 9px; font-family: inherit; font-size: 13.5px; outline: none; }
   .prod-toolbar input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(13,110,253,.12); }
   .prod-cont { font-size: 12.5px; color: var(--muted); white-space: nowrap; }

   .prod-grid { display: grid; gap: 13px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
   .pcard { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff;
     cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .1s; }
   .pcard:hover { border-color: var(--brand); box-shadow: 0 8px 22px rgba(13,110,253,.13); }
   .pcard:active { transform: scale(.985); }
   .pcard .pfoto { aspect-ratio: 4 / 3; background: #f1f5f9; display: grid; place-items: center; overflow: hidden; }
   .pcard .pfoto img { width: 100%; height: 100%; object-fit: cover; display: block; }
   .pcard .sfoto { color: #94a3b8; font-size: 11px; font-weight: 700; letter-spacing: .5px; }
   .pcard .pinfo { padding: 9px 11px 11px; }
   .pcard .pnome { font-size: 13px; font-weight: 600; line-height: 1.25; margin-bottom: 2px;
     display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
   .pcard .pcat { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
   .pcard .ppreco { font-size: 14.5px; font-weight: 700; color: var(--brand); margin-top: 5px; }
   .pcard .pinativo { font-size: 10.5px; font-weight: 700; color: #b91c1c; margin-top: 4px; }

   .prod-foto-area { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; }
   .prod-foto-box { width: 150px; height: 113px; border: 1.5px dashed var(--line); border-radius: 12px;
     background: #f8fafc; display: grid; place-items: center; overflow: hidden; flex: 0 0 auto; position: relative; }
   .prod-foto-box img { width: 100%; height: 100%; object-fit: cover; }
   .prod-foto-box .sfoto { color: #94a3b8; font-size: 11px; font-weight: 700; letter-spacing: .5px; }
   .prod-foto-box .badge-foto { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(15,23,42,.78);
     color: #fff; font-size: 9.5px; padding: 3px 5px; text-align: center; }
   .prod-foto-acoes { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; min-width: 190px; }
   .prod-foto-acoes .hint { font-size: 11.5px; color: var(--muted); }
   .prod-foto-grande { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 12px; background: #f1f5f9; }
   .prod-check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-top: 14px; cursor: pointer; }
   .prod-check input { width: auto; accent-color: var(--brand); }

   /* ===== ABA IMPRESSORAS ===== */
   .imp-subabas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px;
     border-bottom: 1px solid var(--line); padding-bottom: 10px; }
   .imp-subabas button { border: 0; background: transparent; font-family: inherit; font-size: 13px;
     font-weight: 600; color: var(--muted); padding: 8px 13px; border-radius: 8px; cursor: pointer; }
   .imp-subabas button:hover { background: #f1f5f9; color: var(--text); }
   .imp-subabas button.on { background: var(--brand); color: #fff; }
   .imp-h { font-size: 14px; margin: 0 0 12px; color: #334155; }

   .imp-grid { display: grid; gap: 13px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
   .imp-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #fff; }
   .imp-card .imp-nome { font-weight: 700; font-size: 14px; margin-bottom: 9px; word-break: break-word; }
   .imp-linha { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px;
     padding: 3px 0; border-bottom: 1px dashed #eef2f7; }
   .imp-linha:last-of-type { border-bottom: 0; }
   .imp-linha span { color: var(--muted); }
   .imp-linha b { text-align: right; word-break: break-word; }
   .imp-acoes { display: flex; gap: 7px; margin-top: 12px; }
   .imp-acoes .btn { flex: 1; justify-content: center; }

   .st-pronta { color: var(--ok); }
   .st-offline, .st-erro { color: var(--danger); }
   .st-sem_papel, .st-pausada { color: var(--warn); }
   .st-desconhecida { color: var(--muted); }

   .imp-checks { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 14px;
     padding: 12px; background: #fafbfe; border: 1px solid var(--line); border-radius: 10px; }
   .imp-checks .prod-check { margin-top: 0; }

   .st-fila { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
     background: #f1f5f9; color: #475569; white-space: nowrap; }
   .st-fila.st-pendente { background: #fef3c7; color: #b45309; }
   .st-fila.st-processando { background: #dbeafe; color: #1d4ed8; }
   .st-fila.st-impresso { background: #dcfce7; color: #15803d; }
   .st-fila.st-erro, .st-fila.st-cancelado { background: #fee2e2; color: #b91c1c; }
   .st-fila.st-duplicado { background: #ede9fe; color: #6d28d9; }

   .imp-erro { font-size: 11.5px; color: var(--danger); max-width: 220px; word-break: break-word; }
   .imp-previa { background: #f8fafc; border: 1px solid var(--line); border-radius: 9px;
     padding: 14px; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px;
     white-space: pre; overflow-x: auto; max-height: 46vh; line-height: 1.35; margin-top: 12px; }
   .tag-off { font-size: 10px; color: var(--danger); font-weight: 700; }
   .cupom-texto { font-family: ui-monospace, Consolas, monospace; font-size: 12px;
     white-space: pre; margin: 0; line-height: 1.4; }

   .sidebar-bg { position: fixed; inset: 0; background: rgba(15,23,42,.5); opacity: 0;
     visibility: hidden; transition: opacity .2s; z-index: 39; }
   .sidebar-bg.show { opacity: 1; visibility: visible; }

   @media (max-width: 1000px) { .grid3 { grid-template-columns: repeat(2, 1fr); } }
   @media (max-width: 820px) {
     body { grid-template-columns: 1fr; }
     .sidebar { position: fixed; left: 0; top: 0; width: 248px; transform: translateX(-100%);
       transition: transform .22s; }
     .sidebar.open { transform: translateX(0); }
     .topbar .hamburger { display: block; }
     .grid2, .grid3 { grid-template-columns: 1fr; }
     .content { padding: 16px 14px 50px; }
   }
 </style>
</head>
