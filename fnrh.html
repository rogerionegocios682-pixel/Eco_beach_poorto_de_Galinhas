<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>FNRH — Ficha Nacional de Registro de Hóspedes</title>
 <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Inter, system-ui, sans-serif;
      margin: 0; background: #eef2f7; color: #0f172a;
    }

    .toolbar {
      position: sticky; top: 0; z-index: 20;
      background: #0b1220; color: #fff; padding: 12px 22px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 4px 18px rgba(2,6,23,.3);
    }
    .toolbar .brand { font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .toolbar .mark {
      width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(135deg, #3b82f6, #0ea5e9); display: grid; place-items: center;
    }
    .toolbar .mark svg { width: 17px; height: 17px; }
    .toolbar .spacer { flex: 1; }
    .toolbar button {
      border: 0; border-radius: 8px; padding: 9px 15px;
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-print { background: #0d6efd; color: #fff; }
    .btn-back { background: rgba(255,255,255,.12); color: #cbd5e1; }

    .sheet-area { padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 22px; }

    /* Cada via é uma folha A4 */
    .via {
      background: #fff; width: 210mm; min-height: 297mm; padding: 14mm 14mm 10mm;
      box-shadow: 0 8px 30px rgba(15,23,42,.14);
      display: flex; flex-direction: column;
    }
    .via-tag {
      background: #0b1220; color: #fff; font-size: 11px; font-weight: 700;
      letter-spacing: 1.2px; text-transform: uppercase; padding: 6px 12px;
      border-radius: 6px; align-self: flex-start; margin-bottom: 12px;
    }
    .via-head { display: flex; align-items: center; gap: 14px; border-bottom: 2.5px solid #0b1220; padding-bottom: 12px; }
    .via-head .logo {
      width: 54px; height: 54px; border-radius: 10px; flex: 0 0 auto;
      background: linear-gradient(135deg, #3b82f6, #0ea5e9);
      display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 20px;
      overflow: hidden;
    }
    .via-head .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .via-head .emp { flex: 1; min-width: 0; }
    .via-head .emp .nome { font-size: 17px; font-weight: 700; }
    .via-head .emp .dados { font-size: 11.5px; color: #475569; margin-top: 3px; line-height: 1.5; }
    .via-head .titulo { text-align: right; }
    .via-head .titulo .t { font-size: 13px; font-weight: 700; line-height: 1.3; max-width: 190px; }
    .via-head .titulo .n { font-size: 12px; color: #475569; margin-top: 4px; }

    .sec { margin-top: 14px; }
    .sec h4 {
      margin: 0 0 7px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      color: #fff; background: #334155; padding: 5px 9px; border-radius: 4px;
    }
    .grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border: 1px solid #cbd5e1; border-bottom: 0;
    }
    .cell { border-bottom: 1px solid #cbd5e1; border-right: 1px solid #cbd5e1; padding: 6px 9px; min-height: 42px; }
    .cell.c2 { grid-column: span 2; }
    .cell.c3 { grid-column: span 3; }
    .cell.c4 { grid-column: span 4; }
    .cell.nr { border-right: 0; }
    .cell .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .4px; color: #64748b; font-weight: 600; }
    .cell .v { font-size: 12.5px; font-weight: 600; margin-top: 3px; word-break: break-word; }
    .cell .v.big { font-size: 15px; }

    .grid.fin .cell .v { text-align: right; }
    .fim-linha {
      display: flex; justify-content: space-between; gap: 20px; margin-top: 26px;
      font-size: 11px; color: #475569;
    }
    .assin { border-top: 1px solid #94a3b8; padding-top: 5px; flex: 1; text-align: center; margin-top: 34px; }

    .via-foot {
      margin-top: auto; padding-top: 12px; border-top: 1px solid #cbd5e1;
      font-size: 10px; color: #64748b; display: flex; justify-content: space-between; gap: 12px;
    }

    @media print {
      body { background: #fff; }
      .toolbar { display: none !important; }
      .sheet-area { padding: 0; gap: 0; }
      .via { box-shadow: none; width: auto; min-height: auto; height: 297mm; page-break-after: always; }
      .via:last-child { page-break-after: auto; }
      @page { size: A4; margin: 0; }
    }

    @media (max-width: 820px) {
      .sheet-area { padding: 10px; }
      .via { width: 100%; min-height: auto; padding: 16px; }
      .via-head { flex-wrap: wrap; }
      .via-head .titulo { text-align: left; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .cell.c2, .cell.c3, .cell.c4 { grid-column: span 2; }
    }
 </style>
</head>
<body>
 <div class="toolbar">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
      </span>
      FNRH — Ficha Nacional de Registro de Hóspedes
    </div>
    <div class="spacer"></div>
    <button class="btn-print" onclick="window.print()">Imprimir / Gerar PDF</button>
    <button class="btn-back" onclick="window.close()">Fechar</button>
 </div>

 <div class="sheet-area" id="area">
    <div class="empty">Carregando ficha…</div>
 </div>

 <script src="db.js"></script>
 <script src="fnrh.js"></script>
</body>
</html>
